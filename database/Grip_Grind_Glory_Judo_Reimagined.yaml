description:
  en: >-
    Hosted by Anna Janovics, a podcast from a lifestyle brand for judo players who train with
    purpose and think beyond drills and medals, exploring the mindset, the meaning, and the mess of
    personal growth through grappling, with a focus on adult judoka.
comment:
  en: >-
    One of the few podcasts clearly targeting something that is often talked about, the lack of
    'lifestyle' approach in Judo compared with, say, BJJ. This is the podcast component of the wider
    project, and most episodes touch upon points like adult beginners, retention, competition focus,
    etc.
