description:
  en: >-
    MASTERs (Martial Arts for Social Transformation, Ethics, and Rights) is a nonprofit focused on
    building high performance athletes and better coaching systems through judo and Brazilian jiu
    jitsu.


    This channel is where we show how we actually do that.


    You will see training sessions, competition footage, technical breakdowns, and the methodology
    behind our program. We use a constraints-led approach, data, and real competitive feedback to
    develop athletes for the highest levels of the sport, including the Olympic pathway.


    We are not interested in tradition for the sake of tradition. We are interested in what works.


    Our athletes have produced results at the national and international level, and our goal is
    simple. Give people access to coaching, structure, and resources they would not otherwise have.


    If you care about judo, performance, and doing things better, you are in the right place.
comment:
  en: >-
    Producers of the Yume documentary, already added, this is the channel with more content:
    highlights about the activity of the clubs that are a part of the project and their competition
    results, plus interviews and content around the main themes of the project.
