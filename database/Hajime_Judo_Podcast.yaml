description:
  en: >-
    The first Dutch podcast about Judo created by André and Pim van Meerkerk.


    In this JUDO podcast, I, André van Meerkerk, speak with Dutch and Belgian judo enthusiasts, top
    athletes, trainers and coaches, administrators, and other interesting people.


    I discuss the latest judo news and our own judo experiences with my son Pim van Meerkerk.
comment:
  en: >-
    Lots of coverage of IJF competitions, the Judo Eredivisie (Dutch Judo competition league), and
    an obvious focus on all things Dutch, as expected from the subtitle The Dutch Judo Podcast.
    Vigorous release rhythm with often more than one episode per month, so an easy pick for Dutch
    language judoka.
