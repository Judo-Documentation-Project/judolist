description:
  en: >-
    From the JudoTV team, JudoPOD brings deeper stories and bigger conversations from the world of
    judo. Hosts Robin Willingham and Thea Cowen introduce a new podcast from Judo TV dedicated to
    exploring the stories of elite judoka. The series will feature long-form conversations with
    Olympic and world champions to share behind-the-scenes experiences and insights into the sport.
comment:
  en: >-
    The official IJF podcast, focused on interviews with well-known competitors. Very high
    production value, as expected, and hosted by Thea Cowen (a common presence in IJF competition
    commentary) and Robin Willingham (also a regular on IJF media).
