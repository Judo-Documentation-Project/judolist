description:
  en: >-
    Japan, judo and life: culture, history and philosophy. A Norwegian podcast by Arne Midtlund, a
    judoka since 1983, about judo history, technique, Japanese culture and the philosophy behind
    the art. New episodes every other Monday.
comment:
  en: >-
    I wish I understood Norwegian since the episode list covers a lot of ground: from overviews and
    interviews on Norwegian judo to history segments on techniques, Japanese history and
    traditions, profiles of well-known figures in Judo history, it blends current topics with
    evergreen ones. Extraordinary longevity, closing at 150 episodes at the time of writing.
