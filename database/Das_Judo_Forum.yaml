description:
  en: >-
    The Judo Forum is a large German-speaking community dedicated to discussing judo. Topics include
    judo techniques, the history of the sport, training games, and much more.
comment:
  en: >-
    The largest German-speaking forum, and perhaps the most active in Europe; lots of information
    about the history of Judo in Germany, Europe, and the world, plus discussions on techniques,
    history of Judo, news, etc. Worth visiting even for those that do not speak German, especially
    considering the access to automatic translation tools and the wealth of information.
