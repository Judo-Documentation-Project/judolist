description:
  en: >-
    Welcome to Ippon! Stories from the Tatami, the podcast that takes a passionate and thoughtful
    look at the world of Judo. We explore the stories that bring our beloved sport to life with the
    voices of coaches, Olympians, and prominent figures who will share strategies, reflections, and
    a few little secrets with us...
comment:
  en: >-
    Interviews and episodes by three Italian judoka, covering philosophy, competition, life
    experiences - goes beyond interviews with competitors to address pedagogical themes as well. In
    Italian.
