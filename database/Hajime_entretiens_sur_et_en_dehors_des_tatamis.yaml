description:
  en: >-
    Hello and welcome to "Hajime," the podcast from L'Esprit du Judo. A magazine, a website, a large
    judo community, and now a podcast that gives a voice to those who shape French and
    international judo: expert instructors, coaches, champions of yesterday and today, anonymous
    but dedicated judokas who have something to say.
comment:
  en: >-
    Podcast from the well-known magazine «L'Esprit du Judo», with in-depth series on specific
    competitions, with a focus on French judo in general and France's Judo team in particular. Also
    behind-the-scenes interviews, retrospective analysis, and interviews with athletes, coaches,
    practitioners.
