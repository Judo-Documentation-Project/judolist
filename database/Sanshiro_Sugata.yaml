description:
  en: >-
    Kurosawa’s effortless debut is based on a novel by Tsuneo Tomita about the rivalry between judo
    and jujitsu. Starring Susumu Fujita as the title character, Sanshiro Sugata is a thrilling
    martial arts action tale, but it’s also a moving story of moral education that’s quintessential
    Kurosawa.
comment:
  en: >-
    A 1943 Japanese action drama film and the directorial debut of celebrated Japanese film director
    Akira Kurosawa. Sanshiro Sugata is based on the novel of the same name by Tsuneo Tomita, which
    was in turn inspired by the life of Shiro Saigo.
