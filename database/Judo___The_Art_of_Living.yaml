title: Judo - The Art of Living
url: https://www.youtube.com/watch?v=1eVAqM4zfAY
language: en
image:
  contentUrl: https://img.youtube.com/vi/1eVAqM4zfAY/3.jpg
description:
  en: >-
    The EJU President Sergey Soloveychik says: "The idea to create the film _Judo. The Art of
    Living_ was developed by the European Judo Union. The film is aimed specifically at parents of
    young children and teenagers. At the heart of the film’s message are real stories of the people
    who have been able to call on their judo skills in difficult moments of their lives in order to
    survive or find themselves. Nowadays sport plays an important role in how authorities and
    society educates an active young generation. Judo can also help parents to educate strong,
    healthy and respectful children."
comment:
  en: >-
    A perspective on Judo for the visually impaired, as a way to help children recovering from
    chronic illness, and more. A view on Judo beyond competition.
