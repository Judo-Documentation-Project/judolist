description:
  en: >-
    In this short film, we meet one of the world’s top-ranked Judoka’s, George Kerr CBE, who
    invites us into his home and dojo in Edinburgh, Scotland. Created by Richie Georgie – a film
    making collaboration between Rich Round-Turner and George Daniell – the mini-documentary forms
    part of a wider series called In Their Time – a collection of vignettes that capture a day spent
    in the company of retired athletes and former national champions, who each reflect on their
    experiences on the competitive world stage.
comment:
  en: >-
    A short interview (or commentary) with George Kerr, Scottish Judoka, IJF 10th dan, recounting
    how he started to train at the Budokwai and the 4 years he trained in Japan. A very pleasant
    view on a Judo pioneer.
