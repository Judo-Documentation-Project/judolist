description:
  en: >-
    Vince Skillcorn, "The Judo Coach", talks about British and world judo, club life, rules, and
    growing the sport, with guests from beginner to elite level. New episodes every two weeks.
    Pull up a chair.
comment:
  en: >-
    By typical standards of longevity, a classic (started in 2021). The second series restarted in
    2023, with a shift of focus from more 1:1 interviews and towards topics like growing Judo clubs
    or adult learner retention. Still keeps interviews of course, so a bit of everything and a
    healthy focus on Judo topics. UK-based.
