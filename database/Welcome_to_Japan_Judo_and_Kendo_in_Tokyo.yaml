description:
  en: >-
    A documentary by Tigre Film exploring Japan through two of its martial arts, judo and kendo,
    with a focus on their history and culture, filmed in Tokyo.
comment:
  en: >-
    Tokyo seen through the lenses of Judo and Kendo, a documentary on both martial arts and how they
    integrate with Japanese society, with on-site footage. The goal is not to deeply cover either
    martial art in detail, but to highlight their practice, routines, and integration in the Tokyo
    region.
