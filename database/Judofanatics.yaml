description:
  en: >-
    Judo Fanatics was founded by professionals who live by the belief: that knowledge is key and the
    best competitors simply know more.  We make it our mission to find the best competitors and
    coaches on Earth and bring their wisdom to you.
comment:
  en: >-
    Part of the larger "Fanatics" group (which includes BJJ Fanatics and Fanatic Wrestling), Judo
    Fanatics was started by the existing BJJ Fanatics teams and Travis Stevens, and focus on Judo
    instructionables. Lots of instructors, very frequent deals which span the entire group, plus
    bundles: to the extent instructional videos can help, Judo Fanatics has something for everybody.
    The YouTube channel is frequently updated with content from their catalogue.
