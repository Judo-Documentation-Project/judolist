description:
  en: >-
    Written at the Jigokuden in Kyoto, the Budo Beat blog and the Budo Bite mini-podcast dives into
    the spirit and soul of Japan’s martial arts, blending historical insights, philosophical
    ramblings, and a dose of humour into [mostly] weekly musings. Please subscribe and enjoy a
    fresh, irreverent take on all things budo, courtesy of a Kiwi martial arts nut who has somehow
    managed to survive nearly forty years in Japan.
comment:
  en: >-
    Substack of Alex Bennett, well-known Budo scholar with other individual entries in this list.
    The substack covers budo, kendo, Japanese history, all of which often overlap with (or mention)
    Judo, so including it as well.
