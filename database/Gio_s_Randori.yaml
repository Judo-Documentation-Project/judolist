description:
  en: >-
    Gio's Randori is the judo podcast by and with Giovanna Scoccimarro. Giovanna is an Olympian and
    a member of the German national judo team. She has celebrated great success both nationally and
    internationally, including Junior World Champion, European Vice Champion, German Champion, and
    most recently, 5th place in the individual competition and 3rd place with the mixed team at the
    Olympic Games.


    In this podcast, you'll discover the diverse aspects of Giovanna's life as an athlete, and other
    well-known judokas will also be interviewed. Stay tuned and Hajime!
comment:
  en: >-
    Focus on German Judo, with coverage of athletes, competitions, news, and personal experiences of
    the host, Giovanna Scoccimarro, Olympian and German national judo team member. Interviews that
    extend well past Germany in scope, and at close to 200 episodes at the time of writing, with
    often 2 to sometimes 4+ episodes per month. A clear choice for German speakers.
